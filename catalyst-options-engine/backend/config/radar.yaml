  - {symbol: SRPT, name: Sarepta Therapeutics,       ctgov_names: [Sarepta Therapeutics, Inc., Sarepta Therapeutics], tags: [gene-therapy, dmd]}
  - {symbol: ALNY, name: Alnylam Pharmaceuticals,    ctgov_names: [Alnylam Pharmaceuticals],        tags: [rnai]}
  - {symbol: MRK,  name: Merck,                      ctgov_names: [Merck Sharp & Dohme LLC, Merck Sharp & Dohme], tags: [pharma, oncology]}
