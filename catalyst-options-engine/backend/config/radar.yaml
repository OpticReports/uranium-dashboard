# Radar universe for the Catalyst Options Engine.
#
# DELIBERATELY BROADER than the genomics tracker universe: coverage breadth is
# cheap here (the engine only watches for pre-catalyst asymmetry; it does not
# maintain full alpha scoring per name), so the radar carries the whole
# genomics watchlist PLUS the big-biopharma event names the curated tracker
# excludes. The tracker stays curated; the radar stays wide.
#
# Each entry:
#   symbol      : ticker (uppercase)
#   name        : display name
#   ctgov_names : ClinicalTrials.gov REGISTERED sponsor/collaborator aliases.
#                 CT.gov query.spons matches the registered string, not the
#                 brand — "Moderna" finds ~1 trial, "ModernaTX" finds ~40 (the
#                 2026-08-19 melanoma-readout miss). The scanner queries the
#                 UNION of aliases and dedups by NCT id, so listing both the
#                 registered name and the brand is safe and encouraged.
#   tags        : free-form theme tags
radar:
  # --- extended big-biopharma event names (beyond the tracker universe) -------
  - {symbol: MRNA, name: Moderna,                    ctgov_names: [ModernaTX],                      tags: [mrna, oncology, vaccines]}
  - {symbol: BNTX, name: BioNTech,                   ctgov_names: [BioNTech SE, BioNTech],          tags: [mrna, oncology, vaccines]}
  - {symbol: NVO,  name: Novo Nordisk,               ctgov_names: [Novo Nordisk A/S, Novo Nordisk], tags: [metabolic, glp1]}
  - {symbol: LLY,  name: Eli Lilly,                  ctgov_names: [Eli Lilly and Company],          tags: [pharma, metabolic, neuro]}
  - {symbol: VRTX, name: Vertex Pharmaceuticals,     ctgov_names: [Vertex Pharmaceuticals Incorporated, Vertex Pharmaceuticals], tags: [rare-disease, pain]}
