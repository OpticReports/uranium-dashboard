# Refresh intervals for the APScheduler ingestion cron jobs (minutes).
# A module is only scheduled if it is enabled here AND its required key (if any)
# is present; otherwise it logs a warning and is skipped (graceful degradation).
jobs:
  market:
    enabled: true
    interval_minutes: 60
  analyst:
    enabled: true
    interval_minutes: 360
  catalysts:
    enabled: true
    interval_minutes: 720
  science:
    enabled: true
    interval_minutes: 1440
  social:
    enabled: true
    interval_minutes: 120
  scoring:
    # Recompute the Alpha Signal after ingestion settles.
    enabled: true
    interval_minutes: 60
  calls:
    # Grade open trade calls, then generate new ones from fresh flags.
    enabled: true
    interval_minutes: 60
  insiders:
    # Insider transactions move slowly; daily is plenty.
    enabled: true
    interval_minutes: 1440
  short_interest:
    # FINRA publishes short interest bi-monthly; a daily check is plenty.
    enabled: true
    interval_minutes: 1440
  benchmarks:
    # Benchmark ETF bars for relative strength + the regime strip.
    enabled: true
    interval_minutes: 360
  news:
    enabled: true
    interval_minutes: 120    # ~12 runs/day x 1 req/50 tickers - far under Tiingo limits
  discovery:
    # Dynamic universe discovery sweep (census + CT.gov rotation lanes).
    # Daily: the census is cached 24h anyway; thresholds live in discovery.yaml.
    # at_utc anchors the sweep after the US close on weekdays (21:45 UTC =
    # 17:45 EDT / 16:45 EST), so the movers lane always reads a close-to-close
    # move. Remove it to fall back to interval_minutes from boot.
    enabled: true
    interval_minutes: 1440
    at_utc: "21:45"
