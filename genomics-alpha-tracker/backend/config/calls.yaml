# Trade Calls engine configuration.
# The tracker turns its own high-conviction flags into EXACT trade calls
# (entry / stop / target / time horizon), logs them at fire-time, and then
# grades every call against subsequent price action — so signal quality is
# measured, not assumed. Edit + POST /scores/reload to hot-reload.

calls:
  enabled: true

  # Only these flag types auto-generate a call. Long-side setups only for now
  # (the desk is usually long). A flag type may require extra conditions.
  triggers:
    pre_catalyst_sentiment_ramp: {}
    analyst_revision_cluster:
      direction: upward            # downward clusters never generate a long call
    unusual_options_social_spike: {}
    # pullback_into_catalyst and insider_buying_cluster are OBSERVE-ONLY:
    # they fire flags whose forward returns are tracked (/flags/track-record),
    # and get promoted to call triggers only once the evidence supports it.

  # Gates that a triggering flag must ALSO pass before a call is made.
  # Conservative on purpose: false positives are the main failure mode.
  min_composite: 55                # composite Alpha Signal at fire-time
  flag_lookback_hours: 24          # only fresh flags generate calls
  cooldown_days: 14                # no new auto-call on a symbol within this window
  max_open_calls: 10               # cap on concurrent open auto-calls

  # Risk framing for the exact levels — set from evidence, not assumption:
  # docs/BACKTEST_CALLS.md (2y adjusted bars, 30 names, GENUINELY paired
  # exit-config grid — identical entries in every cell — open-first gap-aware
  # fills, cluster-bootstrap CIs, slippage-adjusted plateau selection) picked
  # stop 3.0xATR / 3:1 RR / 45d: net avg R 0.190, positive net-of-costs in
  # BOTH XBI regimes (0.217 above / 0.178 below the 50dma). The 2:1 neighbor
  # (net 0.171) is statistically indistinguishable — the plateau rule decides.
  # Tight (1.5-2x) stops looked better frictionless but LOSE their edge to
  # slippage: small risk units make costs huge in R terms.
  risk:
    atr_window: 14                 # ATR lookback (daily bars)
    stop_atr_mult: 3.0             # stop = entry - 3*ATR (long)
    fallback_stop_pct: 0.08        # stop when ATR can't be computed
    reward_risk: 3.0               # target = entry + reward_risk * (entry - stop)

  # Time horizon. The desk rarely holds through binaries, so a call generated
  # off a pre-catalyst setup expires the day BEFORE its catalyst (sell into
  # the event). Non-catalyst calls get the default horizon.
  horizon:
    default_days: 45               # backtest: 45d beat 20/30d at the picked stop/RR
    min_days: 5
    max_days: 45

  # Liquidity tiers by 20-day MEDIAN daily dollar volume (median, not mean, so
  # one volume-spike day can't promote a thin name for a month). The desk
  # trades $10-100k clips, so thin names need explicit slippage warnings.
  #   Tier A: full sizes fine · Tier B: warn above warn_position_usd ·
  #   Tier C: thin-float — expect slippage at any size.
  liquidity:
    addv_window_days: 20
    tier_a_min_addv: 25000000     # >$25M/day
    tier_b_min_addv: 5000000      # $5-25M/day
    warn_position_usd: 50000
    exclude_tier_c_from_auto_calls: true   # a call the desk can't exit isn't a call
