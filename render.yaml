# Render blueprint (MUST live at the repo root for Blueprint auto-detection).
# Deploys TWO web services: the Genomics Sector Alpha Tracker and the Treasury
# Canary. Each gets its own <name>.onrender.com URL; add custom domains per service.
#
# How to use:
#   1. On Render: New + -> Blueprint -> connect the OpticReports/uranium-dashboard
#      repo. Render reads this file automatically.
#   2. Set the FMP_API_KEY secret when prompted (sync:false => entered in the
#      Render dashboard, never stored in git).
#   3. Apply. Your URL: https://<service-name>.onrender.com
#
# Manual fallback (if you prefer not to use the blueprint):
#   New + -> Web Service -> connect repo -> Runtime: Docker,
#   Root Directory: genomics-alpha-tracker, then add the env vars below.
#
# Note: Render's free tier has an EPHEMERAL disk (SQLite resets on redeploy) and
# spins down after ~15 min idle. BACKFILL_ON_STARTUP re-seeds on cold start.
# For persistent storage, add a disk (paid) or switch DATABASE_URL to Postgres.
services:
  - type: web
    name: genomics-alpha-tracker
    runtime: docker
    # Paths are relative to the REPO ROOT (the project lives in a subdirectory).
    dockerfilePath: genomics-alpha-tracker/Dockerfile
    dockerContext: genomics-alpha-tracker
    plan: starter            # always-on (scheduler runs) + supports a persistent disk
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    buildFilter:
      paths:
        - genomics-alpha-tracker/**
    disk:
      name: data             # persists SQLite + cache across restarts/redeploys
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Authenticated FMP works from cloud IPs (unlike yfinance/StockTwits which
      # get rate-limited/blocked), so use it for prices + fundamentals + analyst.
      - key: MARKET_PROVIDER
        value: fmp
      - key: ANALYST_PROVIDER
        value: fmp
      - key: FMP_API_KEY
        sync: false            # <- you enter this secret in the Render dashboard
      - key: TIINGO_API_KEY
        sync: false            # Tiingo news lane (rate-budgeted; needs the paid News add-on - free-tier keys get 403 and the job skips gracefully)
      # Login gate (protects your proprietary signals on a public URL).
      # Enter both in the Render dashboard when prompted.
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # LLM features (chat analyst, optional LLM sentiment): native Anthropic
      # key preferred; OpenRouter key drives the same Claude models otherwise.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RUN_SCHEDULER
        value: "true"
      - key: BACKFILL_ON_STARTUP
        value: "true"          # seed data on first boot
      - key: DATABASE_URL
        value: sqlite:////app/data/genomics.db
      - key: CACHE_DIR
        value: /app/data/cache
      - key: FRONTEND_DIST
        value: /app/static
      - key: LOG_LEVEL
        value: INFO
      # Reverse-proxy /canary/* to the Canary service so it lives at
      # research.optic.capital/canary (behind this app's login gate). The
      # genomics SPA itself is served at research.optic.capital/genomics/.
      - key: CANARY_UPSTREAM
        value: https://treasury-canary.onrender.com
      # Same pattern: /portfolio-optimizer/* -> Barbell Lab quant platform.
      - key: BARBELL_UPSTREAM
        value: https://barbell-lab.onrender.com
      - key: BTC_UPSTREAM
        value: https://btc-paper-engine.onrender.com
      # Execution tab: reverse-proxy GET /api/execution/feed to the
      # ibkr-executor's read-only /blend/feed. BLEND_READ_TOKEN must equal
      # the executor's READ_TOKEN (injected server-side as X-Read-Token —
      # the browser never sees it). Both sync:false: entered in the Render
      # dashboard; unset = the Execution tab shows its "not connected" card.
      - key: BLEND_UPSTREAM
        sync: false
      - key: BLEND_READ_TOKEN
        sync: false

  # --- Barbell Lab (personal quant research platform) ------------------------
  # Lives at research.optic.capital/portfolio-optimizer behind the genomics
  # service's login gate (see BARBELL_UPSTREAM above). Starter plan + disk:
  # the nightly job (ingest -> validation -> acceptance gates -> monitors)
  # needs an always-on instance, and SQLite/parquet/reports must persist.
  - type: web
    name: barbell-lab
    runtime: docker
    dockerfilePath: barbell-lab/Dockerfile
    dockerContext: barbell-lab
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    buildFilter:
      paths:
        - barbell-lab/**
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: FMP_API_KEY
        sync: false            # cross-provider validation feed (same key as genomics)
      - key: FRED_API_KEY
        sync: false            # optional; public CSV fallback works without it
      - key: TIINGO_API_KEY
        sync: false            # optional third feed
      - key: EXEC_TOKEN
        sync: false            # btc-executor /status read secret (edge-monitor S5 feed; without it the feed reports BLIND, never crashes)
      - key: ANTHROPIC_API_KEY
        sync: false            # chat analyst, native key (preferred if set)
      - key: OPENROUTER_API_KEY
        sync: false            # chat analyst via OpenRouter (default moonshotai/kimi-k3, override with BARBELL_CHAT_MODEL_OPENROUTER); used when no native key. Chat disabled if both unset
      - key: RUN_SCHEDULER
        value: "true"
      - key: INGEST_ON_STARTUP
        value: "true"
      - key: MONITOR_UTC_HOUR
        value: "9"             # 05:00 America/Puerto_Rico
      - key: BARBELL_DATA_DIR
        value: /app/data
      - key: LOG_LEVEL
        value: INFO

  # --- Treasury Market Health Monitor ("The Canary") -------------------------
  # Starter plan + PERSISTENT DISK. This root blueprint is the one Render
  # actually manages the service from — the service was bumped to starter but
  # the disk was never re-added here, so the DB sat on the container's
  # ephemeral filesystem and ALL metric history wiped on every deploy (the
  # 2026-07 "NO DATA" incident). The disk ends that failure class: history
  # survives deploys and the startup backfill becomes a first-boot-only event.
  - type: web
    name: treasury-canary
    runtime: docker
    dockerfilePath: treasury-canary/Dockerfile
    dockerContext: treasury-canary
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    buildFilter:
      paths:
        - treasury-canary/**
    disk:
      name: canary-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TIINGO_API_KEY
        sync: false            # Tiingo NEWS add-on (news pulse lane; absent = pulse reports unavailable, never crashes)
      - key: FRED_API_KEY
        sync: false            # <- enter your free FRED key on THIS service
      - key: FMP_API_KEY
        sync: false            # optional: enables gold (GLD) in the flow compass
      - key: DATABASE_URL
        value: sqlite:////app/data/canary.db   # on the persistent disk
      - key: CACHE_DIR
        value: /app/data/cache
      - key: RUN_SCHEDULER
        value: "true"
      - key: BACKFILL_ON_STARTUP
        value: "true"
      - key: REFRESH_INTERVAL_MINUTES
        value: "720"
      # Telegram two-way analyst (ask the canary questions in Telegram):
      # needs the same TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID as alerts PLUS
      # this OpenRouter key. CHAT_MODEL defaults to moonshotai/kimi-k3.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DISPLAY_TZ
        value: America/Puerto_Rico
      - key: LOG_LEVEL
        value: INFO

  # --- BTC Pullback Paper Engine (research.optic.capital/btc) ---------------
  # Paper trading only — three virtual books, replay-verified against the
  # 2024-2026 research backtest. Persistent disk: the books' equity history
  # and trade log must survive deploys (same lesson as the canary's disk).
  - type: web
    name: btc-paper-engine
    runtime: docker
    dockerfilePath: btc-paper-engine/Dockerfile
    dockerContext: btc-paper-engine
    plan: starter            # always-on: the engine polls 24/7
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    buildFilter:
      paths:
        - btc-paper-engine/**
    disk:
      name: btc-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/paperengine.db
      - key: CACHE_DIR
        value: /app/data/cache
      - key: RUN_ENGINE
        value: "true"
      - key: POLL_SECONDS
        value: "60"
      - key: FRONTEND_DIST
        value: /app/frontend_dist
      - key: LOG_LEVEL
        value: INFO
      # Shared secret for /exec/target (live-executor feed). Same value goes
      # on the btc-executor service. Enter once in the Render dashboard.
      - key: EXEC_TOKEN
        sync: false
      # Funding-regime monitor pages (RESEARCH_CARRY.md deployment policy:
      # V6 carry sleeve parked until 30d INTX funding >= 8%/yr, hysteresis
      # to 5%). Same Canary Optics bot as the executors — paste the same
      # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID here. Unset = silent no-op;
      # /funding still serves the readings either way.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # --- Catalyst Options Engine (pre-catalyst asymmetry radar) ----------------
  # PAPER ONLY + KEYLESS decision brain (born from the 2026-08-19 MRNA +130%
  # melanoma-readout miss). No secrets exist on this service by design — all
  # data lanes are keyless and degrade gracefully. Any future live options
  # execution routes through ibkr-executor, never this service (CLAUDE.md
  # separation-of-powers law). NOTE: the Nasdaq option-chain lane may be
  # blocked from Render's datacenter IPs; the engine runs fine with that lane
  # dark (scenario-IV Black-Scholes pricing, flagged on every affected row).
  - type: web
    name: catalyst-options-engine
    runtime: docker
    dockerfilePath: catalyst-options-engine/Dockerfile
    dockerContext: catalyst-options-engine
    plan: starter            # always-on: daily scan + market-hours chain refresh
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    buildFilter:
      paths:
        - catalyst-options-engine/**
    disk:
      name: options-data     # paper book + catalyst calendar survive deploys
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/options.db
      - key: CACHE_DIR
        value: /app/data/cache
      - key: RUN_SCHEDULER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Future lane (NOT used today): FMP could backstop prices if the
      # keyless stockanalysis lane ever goes dark from datacenter IPs.
      # Optional — the service is fully functional without it.
      - key: FMP_API_KEY
        sync: false

  # NOTE: treasury-canary Telegram alerts — add the same TELEGRAM_BOT_TOKEN /
  # TELEGRAM_CHAT_ID secrets (plus optional TELEGRAM_MIN_SEVERITY, default
  # WARN) to the treasury-canary service env in the Render dashboard.

  # --- S5 Live Executor (Coinbase perps) ------------------------------------
  # Mirrors the paper engine's S5 blend onto a real Coinbase Advanced account.
  # SAFETY: ships with DRY_RUN=true — it cannot place an order until that env
  # is flipped to "false" by hand AFTER the dry-run shadow period checks out.
  # The API key must be created trade-only (view + trade; NO transfers).
  # Full runbook: btc-executor/EXECUTOR.md
  # ---------------------------------------------------------------------
  # code-agent: Telegram-driven coding agent (OpenRouter). Edits the REPO,
  # never the running services.
  #
  # ISOLATION IS THE WHOLE DESIGN. This service deliberately holds NO
  # trading credential - no HL_SECRET_KEY, no EXEC_TOKEN, no CB_API_*. An
  # LLM driven from a chat app has attacker-reachable input by definition,
  # and btc-executor's key can sign trades against real money. app/guard.py
  # re-checks this at boot and REFUSES TO START if any of them are present,
  # because the isolation is a deployment property and a blueprint is a file
  # someone can edit - this repo has already had DRY_RUN flip silently on an
  # unrelated sync.
  #
  # It pushes agent/* branches only. `main` auto-deploys a live book, so a
  # human reviews and merges; that merge is the deploy.
  #
  # NOT a Telegram client. Slav owns the bot and calls this as a tool. A
  # Telegram bot gets exactly ONE delivery mechanism - webhook or polling -
  # so two services wanting the same bot steal it from each other silently,
  # with no error either one can see. One assistant that both answers
  # questions and writes code is the better shape anyway.
  - type: web
    name: code-agent
    runtime: docker
    dockerfilePath: code-agent/Dockerfile
    # ROOT context: the test gate runs the REPO's suite, so the image needs
    # btc-executor's dependencies too - unreachable from a code-agent/ context.
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    # NARROWED likewise. tests/ IS in the image - it is the gate the
    # service runs - so a test change must rebuild. A restart also wipes the
    # in-memory job store, losing the result of any task in flight.
    buildFilter:
      paths:
        - code-agent/app/**
        - code-agent/tests/**
        - code-agent/Dockerfile
        - code-agent/pytest.ini
        - code-agent/requirements.txt
        - btc-executor/requirements.txt
    disk:
      name: repo             # the checkout; a cold clone each boot is slow
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: GITHUB_TOKEN
        # FINE-GRAINED, this repo only, Contents: read+write. NOT a classic
        # token: a classic PAT carries every repo the account can reach, and
        # blast radius is the only thing standing between a bad edit and the
        # rest of the account.
        sync: false
      - key: GITHUB_REPO
        value: OpticReports/uranium-dashboard
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CODE_MODEL
        # OPTIONAL. Has a default in code; this only exists so the model can
        # be changed without a redeploy. NOT sync:false - it is not a secret,
        # and prompting for it made it look mandatory. The value must be a
        # string AIDER recognises (openrouter/<vendor>/<model>) - the model
        # is a per-request field in the API, so something has to name it;
        # there is no "set it once on the OpenRouter side" that removes this.
        # A weak model here wastes tokens, it does not endanger the repo: the
        # path/secret/test gates run on the OUTPUT regardless of who wrote it.
        value: openrouter/moonshotai/kimi-k3
      - key: AGENT_TOKEN
        # Shared secret for POST /task. NOT optional: an unset value makes
        # the service refuse every call (503) rather than serve an
        # unauthenticated endpoint that can push to a repo which deploys a
        # live trading book. Slav sends it as X-Agent-Token.
        sync: false

  - type: web
    name: btc-executor
    runtime: docker
    dockerfilePath: btc-executor/Dockerfile
    dockerContext: btc-executor
    plan: starter            # always-on: mirrors stops 24/7
    healthCheckPath: /health
    autoDeploy: true
    # Only rebuild when THIS service's files change (2026-09-01). Without
    # this, every push to main redeployed every service: a docs-only commit
    # and a change to an unrelated project both restarted btc-executor,
    # which holds live positions. Paths are relative to the REPO ROOT even
    # where dockerContext is not. render.yaml is deliberately absent - a
    # blueprint sync already redeploys the resources it changed, and listing
    # it here would rebuild all nine services on any edit to the file.
    # NARROWED to what the image contains (the Dockerfile copies only
    # requirements.txt and app/). btc-executor/** would still let a docs or
    # tests-only commit restart a container holding live positions - which
    # b6bb758 did today. Same reasoning as ibkr-executor below, which
    # learned it the expensive way on 2026-08-28.
    buildFilter:
      paths:
        - btc-executor/app/**
        - btc-executor/Dockerfile
        - btc-executor/requirements.txt
    disk:
      name: btc-exec-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ENGINE_URL
        value: https://btc-paper-engine.onrender.com
      - key: EXEC_TOKEN
        sync: false            # must match btc-paper-engine's EXEC_TOKEN
      - key: VENUE
        # coinbase | hyperliquid. sync:false for the same reason DRY_RUN is:
        # a blueprint sync that flipped this would point a LIVE book at a
        # different exchange, where its ledger positions and resting orders
        # mean nothing. The code refuses that (VENUE_CHANGED halt, checked
        # before boot reconcile can adopt or abandon anything), but the env
        # must not be able to propose it in the first place. Unset = the
        # code default, coinbase - an absent env can never move the book.
        sync: false
      # --- Hyperliquid (only read when VENUE=hyperliquid) ---
      - key: HL_SECRET_KEY
        # AGENT (API) wallet private key. Approve one in the HL UI under
        # API; it can TRADE but CANNOT WITHDRAW - the same separation of
        # powers as the Coinbase trade-only key, enforced by the venue
        # rather than by our own care. NEVER the main account's key.
        sync: false
      - key: HL_ACCOUNT_ADDRESS
        # REQUIRED for VENUE=hyperliquid, and it is the MAIN account's public
        # address - NOT the agent wallet's. Positions are read by this
        # address; the agent holds nothing, so pointing it at the agent would
        # report the book permanently FLAT. The executor refuses to start
        # rather than guess.
        sync: false
      - key: HL_COIN
        sync: false            # perp symbol, e.g. BTC
      - key: HL_TESTNET
        sync: false            # "true" routes to the testnet API
      - key: CB_API_KEY_NAME
        sync: false            # CDP key name (trade-only key)
      - key: CB_API_PRIVATE_KEY
        sync: false            # CDP EC private key PEM
      - key: CB_PRODUCT_ID
        # US perpetual-style BTC future on Coinbase Derivatives (CDE/FCM):
        # 0.01-BTC contracts, $5 tick, Dec-2030 expiry, display "BTC PERP".
        # sync:false: a sync during a future product migration would point the
        # executor at the OLD product while a position sits on the new one -
        # position() reads only CB_PRODUCT_ID, so the real exposure would
        # vanish from drift checks and halt-flattens (QA 2026-08-11).
        sync: false
      - key: DRY_RUN
        # NEVER a blueprint value. On 2026-08-10 an unrelated render.yaml edit
        # triggered a sync that reset this to "true" and silently un-armed a
        # LIVE account. sync:false keeps the dashboard as the single source of
        # truth; if unset, the code default (True) fails safe.
        sync: false
      # EVERY trading-behavior variable below is sync:false (QA 2026-08-11):
      # the DRY_RUN incident generalizes - a blueprint literal is a pending
      # silent reset on the next unrelated commit, in whichever direction the
      # dashboard has since moved (a re-sync would UNDO a defensive cut, or
      # REVERT a ramp step-down taken while losing). The Render dashboard is
      # the single source of truth; the executor pages on any change via the
      # config_change guard, and code defaults fail safe (kelly 0.05).
      # Ramp is a STAIRCASE - v3, EXECUTOR.md "Ramp schedule": 0.05 -> 0.10
      # -> 0.20 -> 0.35 -> 0.56, advance after 4 trades at a rung AND
      # cumulative ramp P&L >= 0; step DOWN a rung at -$5,000 ramp drawdown.
      # Change KELLY_M one step at a time, never alongside SIZING_BASE_USD.
      # Current dashboard values (2026-08-28, Hyperliquid live-test phase):
      # KELLY_M 0.135, SIZING_BASE_USD 1000, MAX_NOTIONAL_USD 2000,
      # MAX_ACCOUNT_LEV 2.0, DD_HALT_PCT 0.35 (% of sizing base).
      # (was 0.05 / 50000 / 80000 through the Coinbase phase.)
      #
      # KELLY_M 0.135 is deliberately OFF the ramp staircase, and is not
      # ramp progress. It is a VENUE-MECHANICS floor, not an evidence-based
      # step up: Hyperliquid rejects any order under $10 notional and grants
      # reduce-only no exemption, so a position that falls under $10 cannot
      # be closed by ANY order - not its stop, not the halt's flatten. At
      # 0.05 on a $1k base the smaller (trend) leg is $18.75, under 2x that
      # floor; at 0.135 it is $50.62, about 5x. Gross is $202 on a ~$999
      # account (0.20x), so the absolute risk stays token.
      #
      # RAISING THE BASE INSTEAD WOULD HAVE DISARMED A HALT: reaching the
      # same $50 via SIZING_BASE_USD 2700 puts the drawdown halt at 35% of
      # 2700 = $945 on a $999 account, i.e. it could never fire before
      # wipeout. The mirror's halt_config coherence guard warns on exactly
      # this. At base 1000 the rails stay calibrated: DD -$350, daily -$60.
      - key: KELLY_M
        sync: false
      - key: SIZING_BASE_USD
        sync: false
      - key: MAX_NOTIONAL_USD
        sync: false
      - key: MAX_ACCOUNT_LEV
        sync: false
      - key: DD_HALT_PCT
        sync: false
      - key: STATE_PATH
        value: /app/data/executor_state.json
      - key: AUTO_DRILL
        # RAMP v4 auto-drill (RAMP_V4.md amendment 2026-08-17): executor runs
        # its own min-size drills in flat windows until drill coverage is met.
        # sync:false like every trading-behavior var - a blueprint literal
        # could silently re-arm self-trading drills after Casey turns them
        # off. Set "true" in the dashboard to arm; code default is off.
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Telegram alerts (halts/REDs always; live trades when DRY_RUN=false).
      # Setup steps in btc-executor/app/alerts.py. Unset = silent no-op.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # --- IBKR Executor (El Nino options ladder first) --------------------------
  # ALL automated IBKR trading routes through this one service (CLAUDE.md
  # separation-of-powers rule). Ships OFFLINE: with no TWS credentials it
  # runs the full decision loop against a dry adapter and places nothing.
  # Adding PAPER credentials moves it to DRY (paper); LIVE requires
  # TRADING_MODE=live AND DRY_RUN=false, only after the paper rehearsal.
  # Runbook: ibkr-executor/README.md
  - type: web
    name: ibkr-executor
    runtime: docker
    dockerfilePath: ibkr-executor/Dockerfile
    dockerContext: ibkr-executor
    plan: standard           # IB Gateway is Java; needs 2GB (won't fit starter)
    healthCheckPath: /health
    autoDeploy: true
    # Restart this service ONLY for changes that actually affect it. Without
    # a filter, autoDeploy restarts a LIVE trading container on EVERY push to
    # the monorepo - a docs commit on 2026-08-28 restarted it 44 minutes into
    # the session, which re-ran the blend mid-cycle, sold BIL to fund an entry
    # and then had that entry rejected by the venue (MOO/OPG is only valid
    # pre-open). A restart of this service is never free: it also forces a
    # fresh gateway login, which blocks on a 2FA approval.
    # Narrowed to what the IMAGE actually contains (Dockerfile copies only
    # requirements.txt, app/, start.sh). A broad ibkr-executor/** still let a
    # README or tests-only commit restart the live container and force a 2FA
    # gateway login - the exact 2026-08-28 incident this filter exists to
    # prevent (counter-agent).
    buildFilter:
      paths:
        - ibkr-executor/app/**
        - ibkr-executor/Dockerfile
        - ibkr-executor/requirements.txt
        - ibkr-executor/start.sh
    disk:
      name: ibkr-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TWS_USERID
        sync: false          # PAPER username first (usually starts with 'D')
      - key: TWS_PASSWORD
        sync: false
      # Gateway-outage ledger + supervisor restart records. These MUST sit
      # on the mounted disk (/app/data): the code defaults are ./data, which
      # resolves to /opt/executor/data on the EPHEMERAL container layer, so
      # with autoDeploy every push wiped the whole history - including, in
      # its own motivating case, the open outage record when a human
      # redeploys to fix a wedged gateway (counter-agent 2026-08-24).
      # Gateway API write-arming (IBC ReadOnlyApi, via the gnzsnz image).
      # IBC DEFAULTS to read-only: every order the executor placed was
      # refused with error 321 "API interface is currently in Read-Only
      # mode" - the book's first live orders on 2026-08-25 died here.
      # Set READ_ONLY_API=no in the dashboard to arm order placement.
      # sync:false (AUTO_DRILL precedent): an ARMING variable must never be
      # a blueprint literal a sync could silently re-arm after Casey
      # disarms it in the dashboard.
      - key: READ_ONLY_API
        sync: false
      # IB Gateway daily restart + 2FA behaviour (gnzsnz image -> IBC).
      # 2026-09-02/03: unconfigured, the gateway's built-in daily restart
      # fell to the image default (11:45 PM in the image's UTC clock =
      # 19:45 ET) and landed as a PROCESS EXIT: the supervisor relaunched
      # it, the fresh login needed an IB Key push, the push was missed, and
      # the book sat blind 13 h then 12.9 h - two nights running. A restart
      # scheduled THROUGH IBC reuses the session credentials and needs no
      # 2FA (IBC user guide: "authentication is only required the first
      # time during the week after 01:00 ET on Sunday"). All four are
      # sync:false: they change login behaviour on a live account, and any
      # edit restarts the container (set them after 16:00 ET only).
      #   TIME_ZONE=America/New_York        so AUTO_RESTART_TIME reads in ET
      #   AUTO_RESTART_TIME=08:30 PM         format "hh:mm AM/PM"; any hour you
      #                                      can answer SUNDAY's weekly push
      #   TWOFA_TIMEOUT_ACTION=restart       the documented companion setting
      #   RELOGIN_AFTER_TWOFA_TIMEOUT=yes    a missed push re-alerts ~3-minutely
      #                                      until tapped, instead of stalling
      - key: TIME_ZONE
        sync: false
      - key: AUTO_RESTART_TIME
        sync: false
      - key: TWOFA_TIMEOUT_ACTION
        sync: false
      - key: RELOGIN_AFTER_TWOFA_TIMEOUT
        sync: false
      # El Nino ladder is OPT-IN (Casey 2026-08-24: off for now). Code
      # default is false; set LADDER_ENABLED=true in the dashboard before
      # the Nov 2026 window to re-arm. sync:false - trading-behavior var.
      - key: LADDER_ENABLED
        sync: false
      - key: OUTAGE_LOG_PATH
        value: /app/data/gateway_outages.json
      - key: GATEWAY_RESTART_LOG
        value: /app/data/gateway_restarts.jsonl
      # the shell supervisor's own copy of the same path; they must agree
      - key: IBGW_RESTART_LOG
        value: /app/data/gateway_restarts.jsonl
      - key: TRADING_MODE
        # paper | live — read by gateway AND executor. sync:false: this is
        # HALF of the ibkr live gate (with DRY_RUN); as a blueprint literal a
        # sync would flip a LIVE deployment back to paper while it reports
        # healthy — the DRY_RUN incident on the other executor (QA 2026-08-11).
        sync: false
      - key: DRY_RUN
        # never blueprint-managed (see btc-executor note); dashboard owns it
        sync: false
      - key: READ_ONLY_API
        # "no" = gateway accepts orders. sync:false so a defensive dashboard
        # flip to "yes" mid-incident cannot be silently reverted by a sync.
        sync: false
      - key: EXEC_TOKEN
        sync: false          # /status /kill /resume auth (reuse existing)
      - key: READ_TOKEN
        sync: false          # READ-ONLY /blend/feed gate (Execution tab).
                             # Separate from EXEC_TOKEN by design; same value
                             # goes on genomics-alpha-tracker as
                             # BLEND_READ_TOKEN. Unset = feed disabled (404)
      - key: LEG_BUDGET_USD
        sync: false          # $10k per ladder leg now; dashboard owns ramps
      - key: STATE_PATH
        value: /app/data/ladder_state.json
      # Blend book state MUST live on the mounted disk (same lesson as
      # OUTAGE_LOG_PATH above): the code default is ./data on the EPHEMERAL
      # layer, so every deploy silently wiped the blend book — positions,
      # stop journal, pending orders. Harmless in DRY (it just re-inits);
      # FATAL for a live book, which must survive deploys (found 2026-08-27,
      # pre-go-live).
      - key: BLEND_STATE_PATH
        value: /app/data/blend_state.json
      # blend3070 arming + sizing — trading-behavior vars, dashboard-owned
      # (sync:false, AUTO_DRILL/DRY_RUN precedent). BLEND_BOOK_USD is read
      # ONCE, when the live book first initializes; BLEND_BUDGET is the
      # hard gross-notional cap the 85% utilization alarm binds on.
      - key: BLEND_ENABLED
        sync: false
      - key: BLEND_BOOK_USD
        sync: false
      - key: BLEND_BUDGET
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Same Canary Optics bot as btc-executor/canary. Unset = silent no-op.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
