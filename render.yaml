# Render blueprint (MUST live at the repo root for Blueprint auto-detection).
# Deploys TWO web services: the Genomics Sector Alpha Tracker and the Treasury
# Canary. Each gets its own <name>.onrender.com URL; add custom domains per service.
#
# How to use:
#   1. On Render: New + -> Blueprint -> connect the OpticReports/uranium-dashboard
#      repo. Render reads this file automatically.
#   2. Set the FMP_API_KEY secret when prompted (sync:false => entered in the
#      Render dashboard, never stored in git).
#   3. Apply. Your URL: https://<service-name>.onrender.com
#
# Manual fallback (if you prefer not to use the blueprint):
#   New + -> Web Service -> connect repo -> Runtime: Docker,
#   Root Directory: genomics-alpha-tracker, then add the env vars below.
#
# Note: Render's free tier has an EPHEMERAL disk (SQLite resets on redeploy) and
# spins down after ~15 min idle. BACKFILL_ON_STARTUP re-seeds on cold start.
# For persistent storage, add a disk (paid) or switch DATABASE_URL to Postgres.
services:
  - type: web
    name: genomics-alpha-tracker
    runtime: docker
    # Paths are relative to the REPO ROOT (the project lives in a subdirectory).
    dockerfilePath: genomics-alpha-tracker/Dockerfile
    dockerContext: genomics-alpha-tracker
    plan: starter            # always-on (scheduler runs) + supports a persistent disk
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data             # persists SQLite + cache across restarts/redeploys
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Authenticated FMP works from cloud IPs (unlike yfinance/StockTwits which
      # get rate-limited/blocked), so use it for prices + fundamentals + analyst.
      - key: MARKET_PROVIDER
        value: fmp
      - key: ANALYST_PROVIDER
        value: fmp
      - key: FMP_API_KEY
        sync: false            # <- you enter this secret in the Render dashboard
      # Login gate (protects your proprietary signals on a public URL).
      # Enter both in the Render dashboard when prompted.
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # LLM features (chat analyst, optional LLM sentiment): native Anthropic
      # key preferred; OpenRouter key drives the same Claude models otherwise.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RUN_SCHEDULER
        value: "true"
      - key: BACKFILL_ON_STARTUP
        value: "true"          # seed data on first boot
      - key: DATABASE_URL
        value: sqlite:////app/data/genomics.db
      - key: CACHE_DIR
        value: /app/data/cache
      - key: FRONTEND_DIST
        value: /app/static
      - key: LOG_LEVEL
        value: INFO
      # Reverse-proxy /canary/* to the Canary service so it lives at
      # research.optic.capital/canary (behind this app's login gate). The
      # genomics SPA itself is served at research.optic.capital/genomics/.
      - key: CANARY_UPSTREAM
        value: https://treasury-canary.onrender.com
      # Same pattern: /portfolio-optimizer/* -> Barbell Lab quant platform.
      - key: BARBELL_UPSTREAM
        value: https://barbell-lab.onrender.com
      - key: BTC_UPSTREAM
        value: https://btc-paper-engine.onrender.com

  # --- Barbell Lab (personal quant research platform) ------------------------
  # Lives at research.optic.capital/portfolio-optimizer behind the genomics
  # service's login gate (see BARBELL_UPSTREAM above). Starter plan + disk:
  # the nightly job (ingest -> validation -> acceptance gates -> monitors)
  # needs an always-on instance, and SQLite/parquet/reports must persist.
  - type: web
    name: barbell-lab
    runtime: docker
    dockerfilePath: barbell-lab/Dockerfile
    dockerContext: barbell-lab
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: FMP_API_KEY
        sync: false            # cross-provider validation feed (same key as genomics)
      - key: FRED_API_KEY
        sync: false            # optional; public CSV fallback works without it
      - key: TIINGO_API_KEY
        sync: false            # optional third feed
      - key: ANTHROPIC_API_KEY
        sync: false            # chat analyst, native key (preferred if set)
      - key: OPENROUTER_API_KEY
        sync: false            # chat analyst via OpenRouter (default moonshotai/kimi-k3, override with BARBELL_CHAT_MODEL_OPENROUTER); used when no native key. Chat disabled if both unset
      - key: RUN_SCHEDULER
        value: "true"
      - key: INGEST_ON_STARTUP
        value: "true"
      - key: MONITOR_UTC_HOUR
        value: "9"             # 05:00 America/Puerto_Rico
      - key: BARBELL_DATA_DIR
        value: /app/data
      - key: LOG_LEVEL
        value: INFO

  # --- Treasury Market Health Monitor ("The Canary") -------------------------
  # Starter plan + PERSISTENT DISK. This root blueprint is the one Render
  # actually manages the service from — the service was bumped to starter but
  # the disk was never re-added here, so the DB sat on the container's
  # ephemeral filesystem and ALL metric history wiped on every deploy (the
  # 2026-07 "NO DATA" incident). The disk ends that failure class: history
  # survives deploys and the startup backfill becomes a first-boot-only event.
  - type: web
    name: treasury-canary
    runtime: docker
    dockerfilePath: treasury-canary/Dockerfile
    dockerContext: treasury-canary
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: canary-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: FRED_API_KEY
        sync: false            # <- enter your free FRED key on THIS service
      - key: FMP_API_KEY
        sync: false            # optional: enables gold (GLD) in the flow compass
      - key: DATABASE_URL
        value: sqlite:////app/data/canary.db   # on the persistent disk
      - key: CACHE_DIR
        value: /app/data/cache
      - key: RUN_SCHEDULER
        value: "true"
      - key: BACKFILL_ON_STARTUP
        value: "true"
      - key: REFRESH_INTERVAL_MINUTES
        value: "720"
      # Telegram two-way analyst (ask the canary questions in Telegram):
      # needs the same TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID as alerts PLUS
      # this OpenRouter key. CHAT_MODEL defaults to moonshotai/kimi-k3.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DISPLAY_TZ
        value: America/Puerto_Rico
      - key: LOG_LEVEL
        value: INFO

  # --- BTC Pullback Paper Engine (research.optic.capital/btc) ---------------
  # Paper trading only — three virtual books, replay-verified against the
  # 2024-2026 research backtest. Persistent disk: the books' equity history
  # and trade log must survive deploys (same lesson as the canary's disk).
  - type: web
    name: btc-paper-engine
    runtime: docker
    dockerfilePath: btc-paper-engine/Dockerfile
    dockerContext: btc-paper-engine
    plan: starter            # always-on: the engine polls 24/7
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: btc-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/paperengine.db
      - key: CACHE_DIR
        value: /app/data/cache
      - key: RUN_ENGINE
        value: "true"
      - key: POLL_SECONDS
        value: "60"
      - key: FRONTEND_DIST
        value: /app/frontend_dist
      - key: LOG_LEVEL
        value: INFO
      # Shared secret for /exec/target (live-executor feed). Same value goes
      # on the btc-executor service. Enter once in the Render dashboard.
      - key: EXEC_TOKEN
        sync: false

  # NOTE: treasury-canary Telegram alerts — add the same TELEGRAM_BOT_TOKEN /
  # TELEGRAM_CHAT_ID secrets (plus optional TELEGRAM_MIN_SEVERITY, default
  # WARN) to the treasury-canary service env in the Render dashboard.

  # --- S5 Live Executor (Coinbase perps) ------------------------------------
  # Mirrors the paper engine's S5 blend onto a real Coinbase Advanced account.
  # SAFETY: ships with DRY_RUN=true — it cannot place an order until that env
  # is flipped to "false" by hand AFTER the dry-run shadow period checks out.
  # The API key must be created trade-only (view + trade; NO transfers).
  # Full runbook: btc-executor/EXECUTOR.md
  - type: web
    name: btc-executor
    runtime: docker
    dockerfilePath: btc-executor/Dockerfile
    dockerContext: btc-executor
    plan: starter            # always-on: mirrors stops 24/7
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: btc-exec-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ENGINE_URL
        value: https://btc-paper-engine.onrender.com
      - key: EXEC_TOKEN
        sync: false            # must match btc-paper-engine's EXEC_TOKEN
      - key: CB_API_KEY_NAME
        sync: false            # CDP key name (trade-only key)
      - key: CB_API_PRIVATE_KEY
        sync: false            # CDP EC private key PEM
      - key: CB_PRODUCT_ID
        # US perpetual-style BTC future on Coinbase Derivatives (CDE/FCM):
        # 0.01-BTC contracts, $5 tick, Dec-2030 expiry, display "BTC PERP".
        value: BIP-20DEC30-CDE
      - key: DRY_RUN
        value: "true"          # flip to "false" ONLY after the shadow period
      - key: KELLY_M
        value: "0.56"          # start the live phase at 0.05 (token size)
      - key: SIZING_BASE_USD
        # Fixed sizing base (USD). 0 = size on live account equity. Current
        # plan (EXECUTOR.md funding phases): 50000 now, 100000 after the
        # second wire. Halts/caps re-anchor to the base automatically.
        value: "0"
      - key: MAX_NOTIONAL_USD
        value: "25000"
      - key: MAX_ACCOUNT_LEV
        value: "2.0"
      - key: DD_HALT_PCT
        # % OF THE SIZING BASE. Current plan: 0.35 at $50k base / $30k
        # deposit; 0.30 at $100k base / $50k (EXECUTOR.md funding phases).
        value: "0.35"
      - key: STATE_PATH
        value: /app/data/executor_state.json
      - key: LOG_LEVEL
        value: INFO
      # Telegram alerts (halts/REDs always; live trades when DRY_RUN=false).
      # Setup steps in btc-executor/app/alerts.py. Unset = silent no-op.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
