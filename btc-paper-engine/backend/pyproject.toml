[project]
name = "btc-paper-engine"
version = "0.1.0"
description = "BTC pullback paper-trading engine — three validated books, replay-verified"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pandas>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
