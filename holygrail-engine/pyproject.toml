[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holygrail-engine"
version = "0.1.0"
description = "Dalio Holy Grail forward + backtest engine: good, uncorrelated, risk-balanced streams geared to a target vol (not the Composer HG symphony)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
holygrail = "holygrail.cli:main"

[tool.setuptools.packages.find]
include = ["holygrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "network: hits live Yahoo/FRED feeds; skipped unless --run-network (or HOLYGRAIL_NETWORK=1)",
]
